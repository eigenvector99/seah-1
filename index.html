<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>업무자동화 강의 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 왼쪽 노선도(모듈 · 단계 · 실습 도구 바로가기) + 오른쪽 본문.
   교안 슬라이드의 종이색 · 남색 · 주황을 그대로 쓴다. 남색 블록 = 복사해서 쓰는 요청문. */
:root{
  --paper:#f4f2ec; --card:#fcfbf8; --shelf:#e7e3d9; --line:#d9d5ca;
  --ink:#17212b; --ink-2:#46525e; --ink-3:#5f6973;
  --accent:#b8400c; --accent-tint:#f6e2d5;
  --blue:#2a6592; --blue-tint:#deeaf3;
  --ok:#2c6a4c; --ok-tint:#dcebe2;
  --strong:#17212b; --on-strong:#f1eee7;
  --navy:#17212b; --navy-line:#33445a; --navy-wash:rgba(241,238,231,.09);
  --on-navy:#ece9e1; --on-navy-2:#a9b6c2; --on-navy-accent:#f29a6b;
  --t-gemini:#2a6592; --t-studio:#b8400c; --t-notebook:#2c6a4c; --t-sheets:#46525e; --on-tile:#fcfbf8;
  --shadow:0 14px 36px rgba(23,33,43,.2);
  --f-display:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',Menlo,Consolas,'D2Coding',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10171f; --card:#18222c; --shelf:#212d3a; --line:#2e3c4b;
    --ink:#ece9e1; --ink-2:#b6c1cc; --ink-3:#909ca8;
    --accent:#f29a6b; --accent-tint:#3a271c;
    --blue:#8fc0e6; --blue-tint:#1b2c3c;
    --ok:#86cfa7; --ok-tint:#1a2f25;
    --strong:#2b3d52; --on-strong:#f1eee7;
    --navy:#0a1017; --navy-line:#2e3c4b;
    --shadow:0 14px 36px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10171f; --card:#18222c; --shelf:#212d3a; --line:#2e3c4b;
  --ink:#ece9e1; --ink-2:#b6c1cc; --ink-3:#909ca8;
  --accent:#f29a6b; --accent-tint:#3a271c;
  --blue:#8fc0e6; --blue-tint:#1b2c3c;
  --ok:#86cfa7; --ok-tint:#1a2f25;
  --strong:#2b3d52; --on-strong:#f1eee7;
  --navy:#0a1017; --navy-line:#2e3c4b;
  --shadow:0 14px 36px rgba(0,0,0,.5);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.7;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,h4,p,ul,ol{margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
code{font-family:var(--f-mono);font-size:.88em;background:var(--shelf);padding:.1em .4em;border-radius:5px;overflow-wrap:anywhere;word-break:normal}

/* ── 틀 ── */
.app{display:grid;grid-template-columns:284px minmax(0,1fr);align-items:start}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:22px 14px 0;border-right:1px solid var(--line);background:var(--paper);z-index:20}
.main{min-width:0;padding-block:0 96px;padding-inline:clamp(16px,4vw,56px)}
.col{max-width:820px}

/* ── 왼쪽: 이름 · 노선도 · 도구 ── */
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px;text-decoration:none;line-height:1.3}
.brand small{font-size:11.5px;font-weight:600;color:var(--accent)}
.brand strong{font-family:var(--f-display);font-size:21px;font-weight:700}
.nav,.route{display:flex;flex-direction:column;gap:2px}
.nav{gap:8px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink-2);font-size:14.5px;font-weight:500;text-decoration:none;line-height:1.3}
.nav-btn:hover{background:var(--shelf)}
.nav-btn[aria-current="page"]{background:var(--strong);color:var(--on-strong)}
.route{position:relative;padding-block:2px}
.route::before{content:"";position:absolute;left:17px;top:24px;bottom:24px;width:2px;background:var(--line)}
.stop .dot{position:relative;flex:none;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--accent)}
.stop[aria-current="page"] .dot{background:var(--on-navy-accent);border-color:var(--on-strong)}
.stop .st{display:flex;flex-direction:column;min-width:0;flex:1}
.stop small{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.stop[aria-current="page"] small{color:var(--on-navy-accent)}
.cnt{flex:none;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.stop[aria-current="page"] .cnt{color:var(--on-navy-2)}
.sub-nav{position:relative;display:flex;flex-direction:column;gap:1px;padding:4px 0 8px 30px}
.sg{padding:8px 8px 2px;font-size:11.5px;font-weight:700;color:var(--ink-3)}
.sl{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;align-items:start;padding:5px 8px;border-radius:8px;font-size:13.5px;line-height:1.45;color:var(--ink-2);text-decoration:none}
.sl:hover{background:var(--shelf)}
.sl.cur{color:var(--ink);font-weight:600;background:var(--shelf)}
.ck{width:12px;height:12px;margin-top:5px;border-radius:50%;border:1.5px solid var(--ink-3)}
.sl.ok .ck{border-color:var(--ok);background:var(--ok)}
.dock{margin-top:auto;position:sticky;bottom:0;display:flex;flex-direction:column;gap:6px;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.dock-h{padding:0 4px;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-3)}
.lbl-short{display:none}

/* ── 바로가기 버튼 ── */
.launch{display:flex;flex-wrap:wrap;gap:8px}
.go{display:inline-flex;align-items:center;gap:9px;padding:7px 12px 7px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;font-weight:600;line-height:1.3;text-decoration:none;white-space:nowrap}
.go b{font-weight:500;color:var(--ink-3)}
.go:hover{border-color:var(--accent)}
.go.pri{padding-left:7px;background:var(--strong);border-color:var(--strong);color:var(--on-strong)}
.go.pri b{color:var(--on-navy-2)}
.go.pri:hover{border-color:var(--on-navy-accent)}
.go.pri.plain{padding-left:14px}
.mono{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:7px;font-family:var(--f-display);font-style:normal;font-size:12px;font-weight:700;color:var(--on-tile)}
.mono.gemini{background:var(--t-gemini)} .mono.studio{background:var(--t-studio)} .mono.notebook{background:var(--t-notebook)} .mono.sheets{background:var(--t-sheets)}
.dock .go{justify-content:flex-start}
.dock .go b{margin-left:auto}

/* ── 본문 머리 ── */
.sec-head{display:flex;flex-direction:column;gap:12px;padding-block:36px 28px}
.eb{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.sec-head h1{font-family:var(--f-display);font-size:clamp(27px,4.2vw,37px);font-weight:700;line-height:1.22;letter-spacing:-.01em;text-wrap:balance}
.lead{font-size:17px;color:var(--ink-2);max-width:38em}
.out{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:baseline;padding:14px 18px;border-radius:12px;background:var(--shelf)}
.out-h{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.out div{display:flex;flex-direction:column}
.out strong{font-family:var(--f-display);font-size:16.5px;line-height:1.45}
.out span{font-size:14px;color:var(--ink-2)}
.prog{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.prog-bar{flex:1;max-width:260px;height:6px;border-radius:3px;background:var(--shelf);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:3px;transition:width .25s ease}
.toc{display:none;list-style:none;padding:0;flex-wrap:wrap;gap:6px}
.toc a{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13px;text-decoration:none;line-height:1.35}
.toc a.ok{border-color:var(--ok);color:var(--ok)}

/* ── 단계 ── */
.stage{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:20px;padding:12px 14px 12px 18px;border-radius:12px;background:var(--strong);color:var(--on-strong)}
.stage-t{display:flex;flex-direction:column;margin-right:auto;line-height:1.35}
.stage-t small{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--on-navy-accent)}
.stage-t strong{font-family:var(--f-display);font-size:17px}
.stage .go{background:var(--navy-wash);border-color:var(--navy-line);color:var(--on-strong)}
.stage .go b{color:var(--on-navy-2)}
.step{display:flex;flex-direction:column;gap:16px;padding-block:30px;border-top:1px solid var(--line);scroll-margin-top:16px}
.stage + .step{border-top:0}
.step:focus{outline:none}
.step-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.num{display:grid;place-items:center;width:26px;height:26px;margin-top:5px;border-radius:50%;border:2px solid var(--line);color:transparent;font-size:14px;font-weight:700}
.num::after{content:"✓"}
.step.is-done .num{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.step-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.step-t h2{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.32;text-wrap:balance}
.done{display:inline-flex;align-items:center;gap:6px;margin-top:3px;padding:5px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;user-select:none}
.done::before{content:"";width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink-3)}
.done:hover{border-color:var(--ok)}
.step.is-done .done{background:var(--ok-tint);border-color:var(--ok);color:var(--ok)}
.step.is-done .done::before{background:var(--ok);border-color:var(--ok)}
.done:has(input:focus-visible){outline:2.5px solid var(--accent);outline-offset:2px}
.step p{max-width:44em}
h3.sub{font-family:var(--f-display);font-size:16px;font-weight:700;line-height:1.4}
.muted{font-size:13.5px;color:var(--ink-3)}
.grp{display:flex;flex-direction:column;gap:8px;min-width:0}

/* ── 요청문 ── */
.prompt{border:1px solid var(--navy-line);border-radius:12px;background:var(--navy);color:var(--on-navy);overflow:hidden}
.p-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:9px 10px 9px 18px;border-bottom:1px solid var(--navy-line)}
.p-label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--on-navy-accent)}
.p-title{font-size:14px;font-weight:600}
.p-to{margin-left:auto;font-size:12.5px;color:var(--on-navy-2)}
.p-copy{border:1px solid var(--navy-line);border-radius:8px;background:var(--navy-wash);color:var(--on-navy);padding:4px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.p-copy:hover{border-color:var(--on-navy-accent)}
.p-copy.did{background:var(--on-navy-accent);border-color:var(--on-navy-accent);color:var(--navy)}
.p-text{padding:15px 18px 17px;font-size:15px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.p-text.clip{max-height:19.5em;overflow-y:auto}
.p-foot{display:flex;justify-content:center;padding:6px;border-top:1px solid var(--navy-line)}
.p-foot button{border:0;background:none;color:var(--on-navy-2);font-size:13px;cursor:pointer;padding:2px 12px}
.p-foot button:hover{color:var(--on-navy)}
.slot{min-width:5ch;max-width:100%;padding:0 6px;border:0;border-bottom:1.5px dashed var(--on-navy-accent);border-radius:4px 4px 0 0;background:var(--navy-wash);color:var(--on-navy);line-height:1.5}
.slot::placeholder{color:var(--on-navy-accent);opacity:1}
.prompts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;align-items:start}
.prompts .prompt{min-width:0}

/* ── 알림 · 카드 · 흐름 · 표 ── */
.note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:12px 16px;border-radius:12px;max-width:46em;font-size:15px}
.note b.tag{font-size:12px;font-weight:700;letter-spacing:.06em}
.note.check{background:var(--ok-tint)} .note.check b.tag{color:var(--ok)}
.note.warn{background:var(--accent-tint)} .note.warn b.tag{color:var(--accent)}
.note.tip{background:var(--blue-tint)} .note.tip b.tag{color:var(--blue)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:4px;min-width:0;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none}
.card strong{font-family:var(--f-display);font-size:16px;line-height:1.4}
.card span{font-size:14px;color:var(--ink-2);line-height:1.6}
.card .tag{font-size:12px;font-weight:700;color:var(--accent)}
.card em{font-style:normal;font-size:13.5px;font-weight:600}
a.card:hover{border-color:var(--accent)}
.card .more{margin-top:auto;padding-top:6px;font-size:12.5px;font-weight:600;color:var(--blue)}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.node{flex:1 1 120px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);line-height:1.4}
.node small{font-size:11.5px;font-weight:700;color:var(--accent)}
.node strong{font-family:var(--f-display);font-size:15px}
.node span{font-size:13px;color:var(--ink-2)}
.node.end{background:var(--shelf)}
.node .nr{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-style:normal;font-size:12.5px;font-weight:600;color:var(--ink)}
.edge{flex:0 0 auto;align-self:center;color:var(--accent);font-weight:700}
.edge::before{content:"→"}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chips-h{margin-right:4px;font-size:13px;font-weight:700;color:var(--ink-3)}
.chip{padding:3px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13.5px}
.tbl{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.55}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--shelf);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center;width:1%;white-space:nowrap}
td .copy{float:right;margin:0 0 4px 10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;align-items:start}
ol.steps,ul.dots{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;max-width:46em}
ol.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
ol.steps li>b{display:grid;place-items:center;width:24px;height:24px;margin-top:2px;border-radius:50%;border:1.5px solid var(--ink-3);font-family:var(--f-display);font-size:12.5px;font-variant-numeric:tabular-nums}
ul.dots li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px}
ul.dots li::before{content:"";width:6px;height:6px;margin-top:11px;border-radius:50%;background:var(--ink-3)}
.url{display:block;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.6}
.copy,.btn{border:1px solid var(--line);border-radius:8px;background:var(--shelf);padding:4px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.copy:hover,.btn:hover{border-color:var(--accent);color:var(--ink)}
.copy.did{border-color:var(--ok);color:var(--ok)}
.pairs{display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:minmax(0,.7fr) 24px minmax(0,1.3fr);gap:10px;align-items:center}
.pairs-h{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.bad{padding:10px 14px;border:1px dashed var(--ink-3);border-radius:10px;color:var(--ink-3);font-size:14.5px}
.arr{text-align:center;color:var(--accent);font-weight:700} .arr::before{content:"→"}
.good{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 10px 10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14.5px}

/* ── 체크 ── */
ul.checks{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;max-width:46em}
.checks label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.checks label:has(input:checked){border-color:var(--ok);background:var(--ok-tint)}
input[type="checkbox"]{width:18px;height:18px;margin:4px 0 0;accent-color:var(--ok)}
td.c input[type="checkbox"]{margin:2px 0 0}
.checks b{font-weight:600}
.checks span span{display:block;font-size:14px;color:var(--ink-2)}

/* ── 화면 구성 스케치 ── */
.wire{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);max-width:520px}
.w-row{display:grid;grid-template-columns:22px repeat(var(--n),minmax(0,1fr));gap:8px;align-items:stretch}
.w-n{display:grid;place-items:center;align-self:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--paper);font-style:normal;font-size:12px;font-weight:700}
.w-box{display:grid;place-items:center;min-width:0;padding:8px 6px;border:1px dashed var(--ink-3);border-radius:8px;font-size:13px;color:var(--ink-2);text-align:center;line-height:1.35}
.w-box.kpi{border-style:solid;background:var(--shelf);font-weight:600}
.w-box.pane{min-height:64px}

/* ── 입력 위젯 ── */
.rss,.mine{display:flex;flex-direction:column;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.rss-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rss label,.mine label{font-size:13px;font-weight:700;color:var(--ink-2)}
.field{flex:1 1 180px;min-width:0;padding:7px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:15px;font-weight:400;color:var(--ink)}
.field::placeholder{color:var(--ink-3)}

};

function launch(key, label){
  const t = TOOLS[key];
  const short = label ? `<span>${label}</span>` : t.short ? `<span class="lbl-full">${t.label}</span><span class="lbl-short">${t.short}</span>` : `<span>${t.label}</span>`;
  return `<a class="go${t.mono ? ' pri' : ''}" href="${t.url}" target="_blank" rel="noopener">${t.mono ? `<i class="mono ${key}" aria-hidden="true">${t.mono}</i>` : ''}${short}<b aria-hidden="true">↗</b></a>`;
}
function copyBtn(text, label){
  COPY.push(text);
  return `<button class="copy" type="button" data-copy="${COPY.length - 1}">${label || '복사'}</button>`;
}
function promptHTML(b){
  const i = PROMPTS.push(b) - 1;
  let n = 0;
  const body = b.fn ? esc(b.fn()) : esc(b.x).replace(/\{\{(.+?)\}\}/g, (_, k) =>
    `<input class="slot" type="text" id="slot-${i}-${n++}" data-slot="${k}" placeholder="[${k}]" aria-label="${k} 직접 입력" autocomplete="off" spellcheck="false">`);
  const to = b.toText || (b.to ? TOOLS[b.to].name + '에 입력' : '');
  return `<div class="grp">${b.gate ? `<p class="gate">${b.gate}</p>` : ''}<div class="prompt">

    <div class="p-text${b.long ? ' clip' : ''}" id="ptext-${i}"${b.fn ? ` data-dyn="${i}"` : ''}${b.long ? ' tabindex="0"' : ''}>${body}</div>
    ${b.long ? `<div class="p-foot"><button type="button" data-expand="ptext-${i}" aria-expanded="false">전체 펼치기</button></div>` : ''}
  </div></div>`;
}

  if (i.dataset && i.dataset.ans){ onAns(i); return; }
  if (i.classList && i.classList.contains('slot')){
    SLOTS[i.dataset.slot] = i.value;
    $$('.slot').forEach(s => { if (s.dataset.slot === i.dataset.slot){ if (s !== i) s.value = i.value; sizeSlot(s); } });
  } else if (i.id === 'rss-kw') rssUpdate();
});
document.addEventListener('submit', e => e.preventDefault());
let ticking = false;
window.addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(() => { ticking = false; spy(); }); } }, {passive:true});
const fromHash = () => { try{ return decodeURIComponent((location.hash || '').slice(1)); }catch(e){ return ''; } };
window.addEventListener('hashchange', () => go(fromHash()));
go(fromHash());
})();
